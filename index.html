<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyBooks</title>
    <meta name="application-name" content="MyBooks" />
    <meta name="apple-mobile-web-app-title" content="MyBooks" />
    <meta
      name="description"
      content="MyBooks: leitor de EPUB pessoal, com seus livros, progresso e grifos no navegador e Google Drive opcional. MyBooks is a personal EPUB reader with optional Google Drive."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MyBooks" />
    <meta property="og:title" content="MyBooks" />
    <meta
      property="og:description"
      content="Leitor de EPUB pessoal. A personal EPUB reader."
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 16px/1.6 system-ui, sans-serif">
        <h1>MyBooks</h1>
        <p>
          O MyBooks é um leitor de EPUB pessoal: importe seus livros, leia com as
          cores, a fonte e o espaçamento que preferir, grife trechos e escreva
          anotações. Este aplicativo precisa de JavaScript para funcionar.
        </p>
        <p>
          Se você conectar a sua conta Google (opcional), o MyBooks usa o Google
          Drive, com acesso restrito aos arquivos que ele mesmo cria, para
          guardar seus livros, progresso e grifos e levar a leitura de um
          aparelho para outro.
        </p>
        <p>
          MyBooks is a personal EPUB reader: import your books, read with your
          own colors, font and spacing, highlight passages and take notes. It
          needs JavaScript to run. If you connect your Google account
          (optional), MyBooks uses Google Drive, restricted to the files it
          creates itself, to keep your books, reading progress and highlights
          and carry your reading from one device to another.
        </p>
        <p><a href="/privacy">Política de privacidade · Privacy policy</a></p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
